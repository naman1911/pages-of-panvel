<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Pages of Panvel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E9E0CB">
<script>
  // GitHub Pages addresses are case-sensitive, so /Diwali or /QUIZ land
  // here instead of on /diwali or /quiz. If the lower-case address is
  // different, go there straight away (keeping any ?query and #hash).
  (function () {
    var p = location.pathname, low = p.toLowerCase();
    if (low !== p) location.replace(low + location.search + location.hash);
  })();
</script>
<style>
  html{background:#E9E0CB}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;
    font:17px/1.5 system-ui,sans-serif;color:#241D18;text-align:center;
    background-image:repeating-linear-gradient(135deg,rgba(36,29,24,.045) 0 2px,transparent 2px 15px)}
  .k{display:inline-block;background:#241D18;color:#F5EFE2;padding:6px 10px;font:11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-1.5deg)}
  h1{margin:16px 0 8px;font-weight:800;font-size:clamp(40px,12vw,72px);line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
  h1 span{color:#C0302A}
  p{margin:0 auto 22px;max-width:34ch}
  a.b{display:inline-block;padding:14px 20px;background:#241D18;color:#F5EFE2;text-decoration:none;font:12px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;box-shadow:4px 4px 0 #C0302A}
</style>
</head>
<body>
  <main>
    <p class="k">Pages of Panvel</p>
    <h1>This page<br><span>wandered off.</span></h1>
    <p>Maybe it's on someone else's shelf. Try the home page instead.</p>
    <a class="b" href="/">Back to the shelf</a>
  </main>
</body>
</html>
